<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6dfb8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOTCHI LIFE">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=12">
  <title>MOTCHI LIFE</title>
</head>
<body>
  <main class="app">
    <section class="world" aria-label="MOTCHI LIFE 플레이 화면">
      <div class="world-hud"><div><strong id="petName">모찌</strong><small id="generation">1세대</small></div><div class="top-actions"><span id="coinLabel" class="coin-label">🪙 80M</span><button id="soundButton" class="small-button" type="button">🔊 소리</button></div></div>
      <div class="room-window" aria-hidden="true"><i></i></div>
      <div class="room-plant" aria-hidden="true"><i></i></div>
      <div class="room-shelf" aria-hidden="true"><i></i></div>
      <div class="room-rug" aria-hidden="true"></div>
      <div class="room-floor" aria-hidden="true"></div>
      <div class="world-stage"><span id="stageLabel">알</span><span id="ageLabel">0일</span><span id="clockLabel">12:00</span></div>
      <div id="eggBar" class="egg-bar" role="progressbar" aria-label="알 껍질 남은 힘" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><span id="eggGauge"></span><small>알을 빠르게 터치!</small></div>
      <div class="world-actions left"><button type="button" data-action="openFood">🍚<small>밥</small></button><button type="button" data-action="openHygiene">🧼<small>씻기</small></button><button type="button" data-action="cleanPoop">🚽<small>청소</small></button></div>
      <div class="world-actions right"><button type="button" data-action="talk">💬<small>대화</small></button><button type="button" data-action="rest">🛌<small>휴식</small></button><button type="button" data-action="treat">💊<small>치료</small></button></div>
      <div class="pet-scene"><canvas id="petCanvas" width="160" height="128" role="img" aria-label="도트 캐릭터"></canvas><span id="sceneBadge" class="scene-badge" hidden></span></div>
      <div id="speech" class="speech" aria-live="polite">모찌가 기다려요</div>
      <div class="quick-stats"><span id="foodStat">🍚 100/100</span><span id="moodStat">♥ 100/100</span><span id="energyStat">☀ 100/100</span><span id="stressStat">스트레스 0/100</span></div>
      <button class="challenge-button" type="button" data-action="challenge">⚔️ 도전 <small id="challengeLabel">1-1</small></button>
    </section>
    <section class="interface">
      <div id="notice" class="notice" aria-live="polite"></div>
      <div id="screen" class="screen"></div>
      <nav id="tabs" class="tabs" aria-label="게임 메뉴"></nav>
    </section>
  </main>
  <section id="activityLayer" class="activity-layer" aria-label="활동 플레이 화면" hidden>
    <div class="activity-stage">
      <div class="activity-hud"><button id="activityExit" type="button" aria-label="활동 그만두기">←</button><strong id="activityTitle">활동</strong><span id="activityScore">0점</span></div>
      <canvas id="activityCanvas" width="390" height="650" aria-label="직접 조작하는 활동 화면"></canvas>
      <div id="activityInstructions" class="activity-instructions"></div>
      <div id="activityControls" class="activity-controls"></div>
    </div>
  </section>
  <section id="battleLayer" class="battle-layer" aria-label="도전 전투 화면" hidden><div class="battle-stage"><button id="battleExit" type="button">← 집으로</button><canvas id="battleCanvas" width="390" height="650" aria-label="자동 전투"></canvas></div></section>
  <div id="dialogLayer" class="dialog-layer" hidden><div id="dialog" class="dialog" role="dialog" aria-modal="true"></div></div>
  <script src="./activities.js?v=12" defer></script>
  <script src="./battle.js?v=12" defer></script>
  <script src="./game.js?v=12" defer></script>
</body>
</html>
